AWSTemplateFormatVersion: "2010-09-09"
Description: >
  FraudRadar - stack persistente. Recursos que se crean una vez y casi no
  cuestan cuando el pipeline está apagado. Se construye por partes:
  1) presupuestos de costo, 2) bucket de S3 del lakehouse,
  3) tabla DynamoDB de alertas, 4) aviso por SNS con la Lambda notify_alert.

Parameters:
  LambdaCodeKey:
    Type: String
    Description: >
      Clave en el bucket del lakehouse del zip de notify_alert. La define
      deploy_persistent.sh al empaquetar y subir lambda/notify_alert/handler.py.
  BudgetEmail:
    Type: String
    Description: >
      Correo del dueño de la cuenta para los avisos de costo (AWS Budgets). Cambiarlo
      obliga a CloudFormation a reemplazar los presupuestos, que tienen nombre fijo,
      y el reemplazo falla: para cambiarlo hay que borrar antes los dos presupuestos.
    AllowedPattern: "[^@\\s]+@[^@\\s]+\\.[^@\\s]+"
  AlertEmail:
    Type: String
    Description: Correo del analista que recibe las alertas de fraude por SNS (se puede cambiar sin riesgo).
    AllowedPattern: "[^@\\s]+@[^@\\s]+\\.[^@\\s]+"
  CreditUsd:
    Type: Number
    Default: 100
    Description: Crédito promocional del proyecto en USD; es el tope que vigilan los presupuestos.
  RealChargeUsd:
    Type: Number
    Default: 1
    Description: Monto que llegaría a la tarjeta (después de créditos) que dispara la alerta de cargo real.

Resources:
  # Un solo bucket para todo el pipeline, separado por prefijos:
  #   landing/      CSV diarios del core (fuente de ingest_catalogs)
  #   lake/         tablas Delta Bronze, Silver y Gold
  #   checkpoints/  checkpoints de Spark Structured Streaming
  #   athena-results/  resultados de las consultas de Athena
  # Los prefijos no se crean aquí: nacen al escribir el primer objeto.
  LakeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "fraudradar-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: expire-athena-results
            Status: Enabled
            Prefix: athena-results/
            ExpirationInDays: 30

  # Alertas de fraude (ADR-04). La llave alert_id es determinística
  # (hash de user_id, regla e inicio de ventana): la escritura condicional
  # attribute_not_exists(alert_id) hace idempotente la salida de detect_fraud.
  # El hash reparte las escrituras de forma uniforme entre particiones.
  FraudAlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fraud_alerts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alert_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: alert_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        # Consulta del analista: alertas abiertas de un usuario.
        - IndexName: user_id-status-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      # La Lambda notify_alert reacciona a los INSERT (alertas nuevas).
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  # --- Aviso al analista (ADR-04): DynamoDB Streams -> Lambda -> SNS ---

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: fraud-alerts

  # Requiere confirmar la suscripción desde el correo que envía AWS.
  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  NotifyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/fraudradar-notify-alert
      RetentionInDays: 14

  NotifyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: leer-stream-y-publicar
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: !GetAtt FraudAlertsTable.StreamArn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertsTopic

  NotifyFunction:
    Type: AWS::Lambda::Function
    DependsOn: NotifyLogGroup
    Properties:
      FunctionName: fraudradar-notify-alert
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt NotifyRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        S3Bucket: !Ref LakeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          TOPIC_ARN: !Ref AlertsTopic

  # Solo los INSERT (alertas nuevas): un cambio de estado no genera aviso.
  # Sin ventana de espera (latencia) y con respuesta de lote parcial.
  NotifyEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt FraudAlertsTable.StreamArn
      FunctionName: !Ref NotifyFunction
      StartingPosition: LATEST
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 0
      MaximumRetryAttempts: 3
      BisectBatchOnFunctionError: true
      FunctionResponseTypes:
        - ReportBatchItemFailures
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName": ["INSERT"]}'

  # Solo se permite acceso por HTTPS.
  LakeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LakeBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt LakeBucket.Arn
              - !Sub "${LakeBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # Mide el consumo BRUTO (excluye créditos) contra el crédito disponible.
  # Un presupuesto normal descuenta los créditos y marcaría USD 0 siempre.
  CreditConsumptionBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: fraudradar-consumo-credito
        BudgetType: COST
        TimeUnit: ANNUALLY
        BudgetLimit:
          Amount: !Ref CreditUsd
          Unit: USD
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
          IncludeTax: true
          IncludeSubscription: true
          IncludeUpfront: true
          IncludeRecurring: true
          IncludeSupport: true
          IncludeDiscount: true
          UseBlended: false
          UseAmortized: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

  # Mide lo que realmente iría a la tarjeta: incluye créditos e impuestos.
  # Los créditos no cubren impuestos, así que puede saltar por el IVA.
  RealChargeBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: fraudradar-cargo-real
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref RealChargeUsd
          Unit: USD
        CostTypes:
          IncludeCredit: true
          IncludeRefund: true
          IncludeTax: true
          IncludeSubscription: true
          IncludeUpfront: true
          IncludeRecurring: true
          IncludeSupport: true
          IncludeDiscount: true
          UseBlended: false
          UseAmortized: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  LakeBucketName:
    Value: !Ref LakeBucket
  FraudAlertsTableName:
    Value: !Ref FraudAlertsTable
  AlertsTopicArn:
    Value: !Ref AlertsTopic
  FraudAlertsStreamArn:
    Value: !GetAtt FraudAlertsTable.StreamArn
  CreditConsumptionBudgetName:
    Value: fraudradar-consumo-credito
  RealChargeBudgetName:
    Value: fraudradar-cargo-real
