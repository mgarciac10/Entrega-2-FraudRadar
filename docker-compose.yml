# FraudRadar: servicios que corren en contenedores.
# Cada responsable agrega su servicio a medida que lo implementa.
#
# Perfiles:
#   local     desarrollo sin AWS: Kafka propio (KRaft) + creación del topic
#   producer  el productor sintético (en AWS corre en la EC2 t3.medium, contra MSK)
#   spark     spark-master y spark-worker (clúster standalone). Los jobs se lanzan con spark-submit
#             contra spark://spark-master:7077.
#   streaming jobs continuos con restart: always (ingest-bronze y detect-fraud). Necesitan el
#             perfil spark. STREAM_SESSION fija la carpeta del checkpoint (nueva por cada MSK).
#   airflow   Airflow local con PostgreSQL (no accede a AWS salvo que se configure ALERTS_SOURCE)
#
# Desarrollo local (Kafka propio y productor):
#   docker compose --profile local --profile producer up --build
# En AWS (contra MSK; KAFKA_BOOTSTRAP_SERVERS y KAFKA_SECURITY_PROTOCOL=SSL en el .env):
#   docker compose --profile producer up --build
# Spark (clúster) y un job de ejemplo. En Git Bash (Windows) hay que activar MSYS_NO_PATHCONV=1:
# sin eso convierte "/opt/..." y "LAKE_URI=/data/lake" en "C:/Program Files/Git/...".
#   export MSYS_NO_PATHCONV=1 LANDING_URI=/data/catalogs LAKE_URI=/data/lake
#   docker compose --profile spark up -d --build
#   docker compose --profile spark exec -T spark-master /opt/spark/bin/spark-submit
#     --master spark://spark-master:7077 /opt/fraudradar/spark/batch/ingest_catalogs.py
#   (el comando de exec va en una sola línea)
#   UI del master: http://localhost:8080
#
# MSK, S3, DynamoDB, Lambda, SNS, Glue y Athena son servicios gestionados: se crean desde infra/.

name: fraudradar

services:
  kafka:
    profiles: ["local"]
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "29092:29092" # para clientes en tu máquina (fuera de Docker)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Crea el topic con la misma forma que en MSK: 6 particiones y llave user_id.
  kafka-init:
    profiles: ["local"]
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions --partitions 6 --replication-factor 1

  producer:
    profiles: ["producer"]
    build:
      context: .
      dockerfile: producer/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
        required: false # en AWS no hay Kafka local: se usa MSK
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-transactions}
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      PRODUCER_RATE_EPS: ${PRODUCER_RATE_EPS:-20}
      PRODUCER_FRAUD_RATIO: ${PRODUCER_FRAUD_RATIO:-0.02}
      CATALOG_DIR: /app/data/catalogs
    volumes:
      - ./data:/app/data:ro # catálogos generados con producer/generate_catalogs.py
    restart: unless-stopped

  # --- Spark (clúster standalone) ----------------------------------------
  # /data se comparte entre Spark (UID/GID 185) y el driver de Airflow (UID 50000/GID 0).
  # Los grupos y umask 0002 permiten que ambos confirmen logs y archivos Delta.
  # El código se monta en /opt/fraudradar/spark: editar un job no requiere reconstruir la imagen.
  # En AWS las credenciales de S3 y DynamoDB vienen del rol de la EC2; en local, pasa las variables
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN.
  spark-master:
    profiles: ["spark"]
    build:
      context: .
      dockerfile: spark/Dockerfile
    image: fraudradar-spark
    hostname: spark-master
    command:
      - /bin/bash
      - -c
      - umask 0002; exec /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    group_add: ["0"]
    ports:
      - "8080:8080" # UI del master
      - "7077:7077"
    environment: &spark-env
      SPARK_MASTER_HOST: spark-master
      AWS_REGION: ${AWS_REGION:-us-east-2}
      S3_BUCKET: ${S3_BUCKET:-}
      LAKE_URI: ${LAKE_URI:-}
      LANDING_URI: ${LANDING_URI:-}
      CHECKPOINT_URI: ${CHECKPOINT_URI:-}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-transactions}
      # Sin valor: se pasan solo si existen en tu entorno. Una cadena vacía estorbaría a la cadena de
      # credenciales de AWS, que en la EC2 debe caer al rol de la instancia.
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
    volumes: &spark-volumes
      - ./spark:/opt/fraudradar/spark:ro
      - ./tests:/opt/fraudradar/tests:ro
      - ./data:/data

  spark-worker:
    profiles: ["spark"]
    image: fraudradar-spark
    command:
      - /bin/bash
      - -c
      - umask 0002; exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    group_add: ["0"]
    environment:
      <<: *spark-env
      # Defaults for local Docker Desktop; override for a larger AWS instance.
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
    volumes: *spark-volumes

  # --- Jobs de streaming (continuos) --------------------------------------
  # Corren el driver en su propio contenedor y piden ejecutores al clúster. Cada uno toma 1 núcleo
  # para dejar espacio a detect_fraud y a los batch.
  ingest-bronze:
    profiles: ["streaming"]
    image: fraudradar-spark
    hostname: ingest-bronze
    depends_on:
      spark-master:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
        required: false
    command:
      - /bin/bash
      - -c
      - |
        umask 0002
        exec /opt/spark/bin/spark-submit \
          --master spark://spark-master:7077 \
          --conf spark.hadoop.fs.permissions.umask-mode=0002 \
          --conf spark.driver.host=ingest-bronze \
          --conf spark.cores.max=1 \
          --executor-memory 1g \
          /opt/fraudradar/spark/streaming/ingest_bronze.py
    group_add: ["0"]
    environment:
      <<: *spark-env
      STREAM_SESSION: ${STREAM_SESSION:-local}
    volumes: *spark-volumes
    restart: always

  # Lee del topic y escribe las alertas en DynamoDB. Necesita silver/user_profile (build_user_profile):
  # sin esa tabla el job falla al arrancar y restart: always lo reintenta. Para probar en local sin
  # DynamoDB: ALERTS_SINK=console (imprime las alertas). Le deja a ingest-bronze y a los batch el resto
  # del worker (3 núcleos): 1 para cada job de streaming.
  detect-fraud:
    profiles: ["streaming"]
    image: fraudradar-spark
    hostname: detect-fraud
    depends_on:
      spark-master:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
        required: false
    command:
      - /bin/bash
      - -c
      - |
        umask 0002
        exec /opt/spark/bin/spark-submit \
          --master spark://spark-master:7077 \
          --conf spark.hadoop.fs.permissions.umask-mode=0002 \
          --conf spark.driver.host=detect-fraud \
          --conf spark.cores.max=1 \
          --executor-memory 1g \
          /opt/fraudradar/spark/streaming/detect_fraud.py
    group_add: ["0"]
    environment:
      <<: *spark-env
      STREAM_SESSION: ${STREAM_SESSION:-local}
      ALERTS_SINK: ${ALERTS_SINK:-console}
      ALERTS_TABLE: ${ALERTS_TABLE:-fraud_alerts}
      DYNAMODB_ENDPOINT_URL: ${DYNAMODB_ENDPOINT_URL:-}
    volumes: *spark-volumes
    restart: always

  # --- Airflow (batch y orquestación) -------------------------------------
  postgres-airflow:
    profiles: ["airflow"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment:
      <<: &airflow-env
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
        AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-local-dev-only-change-me}
        AWS_REGION: ${AWS_REGION:-us-east-2}
        S3_BUCKET: ${S3_BUCKET:-}
        LAKE_URI: ${LAKE_URI:-/data/lake}
        LANDING_URI: ${LANDING_URI:-/data/catalogs}
        CHECKPOINT_URI: ${CHECKPOINT_URI:-/data/checkpoints}
        ALERTS_SOURCE: ${ALERTS_SOURCE:-local-json}
        ALERTS_JSON: ${ALERTS_JSON:-/opt/fraudradar/tests/fixtures/alerts.json}
        ALERTS_TABLE: ${DYNAMODB_ALERTS_TABLE:-fraud_alerts}
        DYNAMODB_ENDPOINT_URL: ${DYNAMODB_ENDPOINT_URL:-}
        PYSPARK_PYTHON: python3
        PYSPARK_DRIVER_PYTHON: python3
        PYTHONPATH: /opt/fraudradar/spark/common:/opt/fraudradar/spark/batch:/opt/fraudradar/spark/streaming
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_USER_PASSWORD:-local-only-change-me}
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_WWW_USER_EMAIL:-admin@example.com}
      _AIRFLOW_WWW_USER_FIRSTNAME: ${AIRFLOW_WWW_USER_FIRSTNAME:-Local}
      _AIRFLOW_WWW_USER_LASTNAME: ${AIRFLOW_WWW_USER_LASTNAME:-User}
      _AIRFLOW_WWW_USER_ROLE: Admin
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./sql/athena:/opt/fraudradar/sql/athena:ro
      - ./spark:/opt/fraudradar/spark:ro
      - ./tests:/opt/fraudradar/tests:ro
      - ./data:/data
    command: version

  airflow-webserver:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "127.0.0.1:8081:8080"
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    environment:
      <<: *airflow-env
    volumes: *airflow-volumes
    group_add: ["185"]
    command: ["bash", "-c", "umask 0002; exec airflow scheduler"]
    restart: unless-stopped

volumes:
  airflow-db:
