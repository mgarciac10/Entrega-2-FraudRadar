# FraudRadar: servicios que corren en contenedores.
# Cada responsable agrega su servicio a medida que lo implementa.
#
# Perfiles:
#   local     desarrollo sin AWS: Kafka propio (KRaft) + creación del topic
#   producer  el productor sintético (en AWS corre en la EC2 t3.medium, contra MSK)
#   spark     (pendiente) spark-master, spark-worker, ingest-bronze, detect-fraud
#   airflow   (pendiente) postgres, scheduler y webserver
#
# Desarrollo local (Kafka propio y productor):
#   docker compose --profile local --profile producer up --build
# En AWS (contra MSK; KAFKA_BOOTSTRAP_SERVERS y KAFKA_SECURITY_PROTOCOL=SSL en el .env):
#   docker compose --profile producer up --build
#
# MSK, S3, DynamoDB, Lambda, SNS, Glue y Athena son servicios gestionados: se crean desde infra/.

name: fraudradar

services:
  kafka:
    profiles: ["local"]
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "29092:29092" # para clientes en tu máquina (fuera de Docker)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Crea el topic con la misma forma que en MSK: 6 particiones y llave user_id.
  kafka-init:
    profiles: ["local"]
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions --partitions 6 --replication-factor 1

  producer:
    profiles: ["producer"]
    build:
      context: .
      dockerfile: producer/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
        required: false # en AWS no hay Kafka local: se usa MSK
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-transactions}
      PRODUCER_RATE_EPS: ${PRODUCER_RATE_EPS:-20}
      PRODUCER_FRAUD_RATIO: ${PRODUCER_FRAUD_RATIO:-0.02}
      CATALOG_DIR: /app/data/catalogs
    volumes:
      - ./data:/app/data:ro # catálogos generados con producer/generate_catalogs.py
    restart: unless-stopped
